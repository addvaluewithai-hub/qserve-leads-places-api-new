name: One-time cancel active ZIP V5

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  cancel:
    if: github.event.issue.title == 'CANCEL-QSERVE-ZIP-AB-33855458586'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate ZIP relaxation benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 33855458586 -R addvaluewithai-hub/qserve-leads-places-api-new
