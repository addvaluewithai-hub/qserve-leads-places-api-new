name: Grounding Tile Multi Probe

on:
  push:
    paths:
      - ".github/workflows/grounding-tile-multi-probe.yml"
      - "scripts/probe_grounding_tile_multi.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m py_compile scripts/probe_grounding_tile_multi.py
      - name: Ask one Grounding query for multiple law firms in one tile
        run: python scripts/probe_grounding_tile_multi.py
