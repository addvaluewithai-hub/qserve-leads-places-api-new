name: Crawl lawyer working set homepages

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "GitHub Actions run ID containing lawyers-1000-working-set artifact"
        required: true
        default: "33604156200"
      start:
        description: "Zero-based start row in lawyers_1000.csv"
        required: true
        default: "0"
      limit:
        description: "Number of homepages to crawl"
        required: true
        default: "100"

permissions:
  actions: read
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BATCH_START: ${{ inputs.start }}
      BATCH_LIMIT: ${{ inputs.limit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download 1000-lawyer working set artifact
        run: |
          mkdir -p input
          gh run download "$BUILD_RUN_ID" -n lawyers-1000-working-set -D input
          test -f input/lawyers_1000.csv
          python - <<'PY'
          import csv
          p='input/lawyers_1000.csv'
          with open(p, encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          print(f"working_set_rows={len(rows)}")
          PY
      - name: Install Crawl4AI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crawl.txt
          crawl4ai-setup
      - name: Crawl homepage-only batch
        run: |
          OUT="out/lawyers-1000/homepages-${BATCH_START}-${BATCH_LIMIT}"
          python scripts/crawl_working_set_homepages.py \
            --input input/lawyers_1000.csv \
            --out-dir "$OUT" \
            --start "$BATCH_START" \
            --limit "$BATCH_LIMIT"
      - name: Upload homepage-link batch
        uses: actions/upload-artifact@v4
        with:
          name: lawyers-homepages-${{ env.BATCH_START }}-${{ env.BATCH_LIMIT }}
          path: out/lawyers-1000/homepages-${{ env.BATCH_START }}-${{ env.BATCH_LIMIT }}/
          if-no-files-found: error
