name: One-time requested next 1000 ZIP V6

on:
  issues:
    types: [opened]

concurrency:
  group: lawyers-us-next1000-v6
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  run:
    if: github.event.issue.title == 'RUN-QSERVE-ZIP-V6-20260902-RETRY6'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ZIP discovery + Crawl4AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pgeocode pandas tldextract
          pip install -r requirements-crawl.txt
          crawl4ai-setup
      - name: Static compile check
        run: |
          python -m py_compile \
            scripts/discovery_cohort_manager.py \
            scripts/build_next_1000_lawyers_zip_v3.py \
            scripts/build_next_1000_lawyers_zip_v4.py \
            scripts/build_next_1000_lawyers_zip_v5.py \
            scripts/build_next_1000_lawyers_zip_v6.py \
            scripts/zip_manager.py \
            scripts/d1_helpers.py
      - name: Continue active next-1000 cohort with relaxed ZIP-area acceptance
        run: |
          python scripts/build_next_1000_lawyers_zip_v6.py \
            --campaign lawyers-us \
            --target 1000 \
            --max-zips 5000 \
            --max-search-requests 900
      - name: Upload V6 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lawyers-us-next-1000-zip-v6
          path: out/lawyers-us-next-*/
          if-no-files-found: warn
