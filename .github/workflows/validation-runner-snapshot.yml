name: Validation runner D1 snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validation-runner-snapshot.yml"

permissions:
  contents: write

jobs:
  snapshot-next-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify D1 secrets
        shell: bash
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN D1_DATABASE_ID; do
            test -n "${!name}" || { echo "$name is missing"; exit 2; }
          done

      - name: Export validation snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          database = os.environ['D1_DATABASE_ID']
          endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'

          def query(sql, params=None):
              payload = json.dumps({'sql': sql, 'params': params or []}).encode()
              req = urllib.request.Request(endpoint, data=payload, headers={
                  'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'
              }, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
              if not body.get('success'):
                  raise SystemExit(json.dumps(body))
              result = body.get('result') or []
              return (result[0].get('results') or []) if result else []

          counts_rows = query('''
              SELECT status, COUNT(*) AS count FROM campaign_leads
              WHERE campaign_id = ? GROUP BY status ORDER BY status
          ''', ['lawyers-us'])
          counts = {row['status']: row['count'] for row in counts_rows}
          counts['Total'] = sum(counts.values())
          counts['QualifiedFlag'] = (query(
              'SELECT COUNT(*) AS count FROM campaign_leads WHERE campaign_id = ? AND qualified = 1',
              ['lawyers-us'],
          ) or [{'count': 0}])[0]['count']

          base_select = '''
              SELECT l.id, l.name, l.website, l.address, l.phone, l.primary_type,
                     cl.campaign_id, cl.status, cl.qualified, cl.quality_score,
                     cl.qualification_reason, cl.notes, cl.first_seen_at, cl.last_seen_at,
                     d.website_domain
              FROM campaign_leads cl
              JOIN leads l ON l.id = cl.lead_id
              LEFT JOIN lead_domains d ON d.lead_id = cl.lead_id
          '''
          ready_where = '''
              WHERE cl.campaign_id = ? AND cl.status = 'Ready for Validation' AND cl.qualified = 0
          '''
          ordering = ' ORDER BY cl.quality_score DESC, cl.first_seen_at ASC, cl.lead_id ASC '

          leads = query(base_select + ready_where + ordering + ' LIMIT 1', ['lawyers-us'])
          batch = query(base_select + ready_where + ordering + ' LIMIT 12', ['lawyers-us'])

          out = {
              'campaign_id': 'lawyers-us', 'counts': counts,
              'selection_rule': "status='Ready for Validation' AND qualified=0; quality_score DESC, first_seen_at ASC, lead_id ASC",
              'lead': None, 'homepage_links': [], 'existing_service_gap_evidence': [], 'existing_contacts': [],
          }
          if leads:
              lead = leads[0]; lead_id = lead['id']; out['lead'] = lead
              out['homepage_links'] = query('''
                  SELECT homepage, final_url, url, anchor_text, crawled_at FROM homepage_link_evidence
                  WHERE campaign_id = ? AND lead_id = ? ORDER BY url
              ''', ['lawyers-us', lead_id])
              out['existing_service_gap_evidence'] = query('''
                  SELECT service_name, status, service_offered_evidence, dedicated_page_url,
                         validation_method, notes, validated_at FROM service_gap_evidence
                  WHERE campaign_id = ? AND lead_id = ? ORDER BY service_name
              ''', ['lawyers-us', lead_id])
              out['existing_contacts'] = query('''
                  SELECT id, person_name, role, email, is_owner, is_decision_maker,
                         is_direct_email, is_publicly_verified, evidence_source, verified_at, notes
                  FROM lead_contacts WHERE lead_id = ?
                  ORDER BY is_decision_maker DESC, is_owner DESC, person_name
              ''', [lead_id])

          Path('agents/validation next lead.json').write_text(
              json.dumps(out, indent=2, ensure_ascii=False)+'\n', encoding='utf-8'
          )
          Path('agents/validation next batch.json').write_text(
              json.dumps({
                  'campaign_id': 'lawyers-us',
                  'selection_rule': out['selection_rule'],
                  'generated_from_current_d1_queue': True,
                  'leads': batch,
              }, indent=2, ensure_ascii=False)+'\n', encoding='utf-8'
          )

          # New-production validation pre-screen. Agent 1 has already crawled the homepage.
          # This view intentionally stays compact: 20 leads, page paths + short anchors only.
          new_where = ready_where + " AND cl.qualification_reason = 'working_set_ready_for_validation' "
          new_batch = query(base_select + new_where + ordering + ' LIMIT 20', ['lawyers-us'])

          service_tokens = {
              'criminal','defense','dui','dwi','drug','drugs','assault','theft','burglary','sex','domestic','violence',
              'traffic','reckless','speeding','injury','injuries','accident','accidents','car','truck','motorcycle','wrongful','death',
              'malpractice','workers','comp','slip','fall','premises','immigration','family','divorce','custody','child','support',
              'adoption','bankruptcy','estate','probate','will','trust','business','corporate','employment','disability','veteran',
              'maritime','product','liability','expungement','civil','rights','discrimination','harassment','wage','foreclosure',
              'garnishment','tax','lemon','dealer','fraud','nursing','birth','pedestrian','rideshare','uber','lyft','dog','bite',
              'litigation','securities','mergers','acquisitions','intellectual','property','homicide','appeals','felony','misdemeanor'
          }
          service_phrases = {
              'civil rights','social security','workers comp','medical malpractice','personal injury','wrongful death',
              'real estate','estate planning','family law','criminal defense','product liability','premises liability',
              'dog bite','birth injury','motor vehicle','white collar'
          }
          hub_segments = {
              'practice-areas','practice-area','areas-of-practice','services','service','what-we-do','case-types',
              'legal-services','our-practice','our-services'
          }
          noise_segments = {
              'blog','blogs','news','article','articles','resource','resources','testimonial','testimonials','review','reviews',
              'case-results','case-result','case-successes','case-success','case-victories','results','successes',
              'about','about-us','contact','contact-us','team','attorneys','attorney','lawyers','staff','locations','location',
              'offices','office','privacy','terms','sitemap','charity','fees','careers','career','events','faqs','faq',
              'appointment','appointments','free-resources','free-evaluation','areas-we-serve','client-portal-guide'
          }
          noise_prefixes = (
              'contact-', 'about-', 'blog-', 'news-', 'resource-', 'testimonial-', 'review-',
              'case-result', 'case-success', 'case-victor', 'location-', 'office-', 'attorney-', 'lawyer-profile', 'faq-'
          )
          noise_contains = ('case-result', 'case-success', 'case-victor')
          asset_exts = {
              '.png','.jpg','.jpeg','.gif','.svg','.webp','.avif','.ico','.pdf','.css','.js','.map','.xml','.txt',
              '.zip','.mp3','.mp4','.webm','.woff','.woff2','.ttf','.eot'
          }
          generic_anchors = {'', 'learn more', 'read more', 'more', 'click here', 'view more', 'details', 'home', 'skip to content', 'skip to main content'}
          date_path = re.compile(r'^/\d{4}/\d{1,2}/(?:\d{1,2}/)?')
          token_re = re.compile(r'[a-z0-9]+')

          def compact_anchor(value):
              text = ' '.join(str(value or '').split())
              if text.lower() in generic_anchors:
                  return ''
              return text[:80]

          def page_path(url):
              raw = urlparse(url or '').path or '/'
              parts = [part for part in raw.split('/') if part]
              return '/' + '/'.join(parts) if parts else '/'

          def is_asset(path):
              low = path.lower()
              if '/wp-content/uploads/' in low or '/wp-includes/' in low or '/assets/images/' in low:
                  return True
              return Path(low).suffix in asset_exts

          def is_content_noise(path):
              low = path.lower()
              if date_path.match(low):
                  return True
              parts = [part for part in low.strip('/').split('/') if part]
              for part in parts:
                  if part in noise_segments or part.startswith(noise_prefixes) or any(marker in part for marker in noise_contains):
                      return True
              return False

          def architecture_score(path, anchor):
              low_path = path.lower()
              path_parts = [part for part in low_path.strip('/').split('/') if part]
              normalized = (low_path.replace('-', ' ').replace('_', ' ') + ' ' + anchor.lower())
              tokens = set(token_re.findall(normalized))
              service_hits = len(tokens & service_tokens)
              phrase_hits = sum(1 for phrase in service_phrases if phrase in normalized)
              hub_hits = len(set(path_parts) & hub_segments)
              if service_hits == 0 and phrase_hits == 0 and hub_hits == 0:
                  return 0
              score = service_hits * 3 + phrase_hits * 4 + hub_hits * 5
              if len(path_parts) >= 2:
                  score += 1
              if anchor and anchor.lower() not in generic_anchors:
                  score += 1
              return score

          compact = []
          metadata_only = []
          for lead in new_batch:
              rows = query('''
                  SELECT url, anchor_text FROM homepage_link_evidence
                  WHERE campaign_id = ? AND lead_id = ? ORDER BY url
              ''', ['lawyers-us', lead['id']])

              page_rows = []
              signals = []
              seen_paths = set()
              for row in rows:
                  path = page_path(row.get('url'))
                  if path in seen_paths or is_asset(path):
                      continue
                  seen_paths.add(path)
                  anchor = compact_anchor(row.get('anchor_text'))
                  page_rows.append((path, anchor))
                  if is_content_noise(path):
                      continue
                  score = architecture_score(path, anchor)
                  if score > 0:
                      signals.append((score, path, anchor))

              signals.sort(key=lambda item: (-item[0], item[1]))
              visible = [
                  f"{path} | {anchor}" if anchor else path
                  for _, path, anchor in signals[:12]
              ]
              signal_count = len(signals)
              if len(page_rows) == 0:
                  hint = 'crawl_review'
              elif signal_count >= 4:
                  hint = 'likely_mature'
              elif signal_count <= 1:
                  hint = 'candidate_deep_check'
              else:
                  hint = 'review_links'

              compact.append({
                  'id': lead['id'],
                  'name': lead['name'],
                  'domain': lead['website_domain'],
                  'page_links': len(page_rows),
                  'signals': signal_count,
                  'hint': hint,
                  'links': visible,
              })
              metadata_only.append({
                  'id': lead['id'], 'name': lead['name'], 'domain': lead['website_domain'],
                  'website': lead['website'], 'page_link_count': len(page_rows),
                  'architecture_signal_count': signal_count, 'screen_hint': hint,
              })

          new_ready_count = (query('''
              SELECT COUNT(*) AS count FROM campaign_leads
              WHERE campaign_id = ? AND status = 'Ready for Validation' AND qualified = 0
                AND qualification_reason = 'working_set_ready_for_validation'
          ''', ['lawyers-us']) or [{'count': 0}])[0]['count']

          Path('agents/validation next new batch.json').write_text(
              json.dumps({
                  'campaign_id': 'lawyers-us',
                  'new_ready_count': new_ready_count,
                  'batch_size': len(metadata_only),
                  'selection_rule': "new production only; Crawl4AI homepage evidence already exists",
                  'leads': metadata_only,
              }, indent=2, ensure_ascii=False)+'\n', encoding='utf-8'
          )
          Path('agents/validation new crawl prescreen.json').write_text(
              json.dumps({
                  'campaign_id': 'lawyers-us',
                  'new_ready_count': new_ready_count,
                  'batch_size': len(compact),
                  'format': "links are compact 'path | anchor' strings; assets/date-blog/utility/case-result pages omitted",
                  'important': "hint is heuristic only; candidates still require independent website double-check",
                  'leads': compact,
              }, indent=2, ensure_ascii=False)+'\n', encoding='utf-8'
          )
          print(json.dumps({
              'new_ready_count': new_ready_count,
              'batch_size': len(compact),
              'prescreen': compact,
          }, indent=2, ensure_ascii=False))
          PY

      - name: Commit snapshots when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "agents/validation next lead.json" "agents/validation next batch.json" \
                  "agents/validation next new batch.json" "agents/validation new crawl prescreen.json"
          if git diff --cached --quiet; then
            echo "Snapshots unchanged."
            exit 0
          fi
          git commit -m "Refresh validation runner snapshots"
          git push
