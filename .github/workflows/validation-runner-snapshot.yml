name: Validation runner D1 snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validation-runner-snapshot.yml"

permissions:
  contents: write

jobs:
  snapshot-next-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify D1 secrets
        shell: bash
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN D1_DATABASE_ID; do
            test -n "${!name}" || { echo "$name is missing"; exit 2; }
          done

      - name: Export validation snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          database = os.environ['D1_DATABASE_ID']
          endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'

          def query(sql, params=None):
              payload = json.dumps({'sql': sql, 'params': params or []}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
              if not body.get('success'):
                  raise SystemExit(json.dumps(body))
              result = body.get('result') or []
              if not result:
                  return []
              return result[0].get('results') or []

          counts_rows = query('''
              SELECT status, COUNT(*) AS count
              FROM campaign_leads
              WHERE campaign_id = ?
              GROUP BY status
              ORDER BY status
          ''', ['lawyers-us'])
          counts = {row['status']: row['count'] for row in counts_rows}
          counts['Total'] = sum(counts.values())
          counts['QualifiedFlag'] = (query(
              'SELECT COUNT(*) AS count FROM campaign_leads WHERE campaign_id = ? AND qualified = 1',
              ['lawyers-us'],
          ) or [{'count': 0}])[0]['count']

          base_select = '''
              SELECT
                l.id, l.name, l.website, l.address, l.phone, l.primary_type,
                cl.campaign_id, cl.status, cl.qualified, cl.quality_score,
                cl.qualification_reason, cl.notes, cl.first_seen_at, cl.last_seen_at,
                d.website_domain
              FROM campaign_leads cl
              JOIN leads l ON l.id = cl.lead_id
              LEFT JOIN lead_domains d ON d.lead_id = cl.lead_id
          '''
          ready_where = '''
              WHERE cl.campaign_id = ?
                AND cl.status = 'Ready for Validation'
                AND cl.qualified = 0
          '''
          ordering = ' ORDER BY cl.quality_score DESC, cl.first_seen_at ASC, cl.lead_id ASC '

          leads = query(base_select + ready_where + ordering + ' LIMIT 1', ['lawyers-us'])
          batch = query(base_select + ready_where + ordering + ' LIMIT 12', ['lawyers-us'])

          out = {
              'campaign_id': 'lawyers-us',
              'counts': counts,
              'selection_rule': "status='Ready for Validation' AND qualified=0; quality_score DESC, first_seen_at ASC, lead_id ASC",
              'lead': None,
              'homepage_links': [],
              'existing_service_gap_evidence': [],
              'existing_contacts': [],
          }

          if leads:
              lead = leads[0]
              lead_id = lead['id']
              out['lead'] = lead
              out['homepage_links'] = query('''
                  SELECT homepage, final_url, url, anchor_text, crawled_at
                  FROM homepage_link_evidence
                  WHERE campaign_id = ? AND lead_id = ?
                  ORDER BY url
              ''', ['lawyers-us', lead_id])
              out['existing_service_gap_evidence'] = query('''
                  SELECT service_name, status, service_offered_evidence,
                         dedicated_page_url, validation_method, notes, validated_at
                  FROM service_gap_evidence
                  WHERE campaign_id = ? AND lead_id = ?
                  ORDER BY service_name
              ''', ['lawyers-us', lead_id])
              out['existing_contacts'] = query('''
                  SELECT id, person_name, role, email, is_owner, is_decision_maker,
                         is_direct_email, is_publicly_verified, evidence_source,
                         verified_at, notes
                  FROM lead_contacts
                  WHERE lead_id = ?
                  ORDER BY is_decision_maker DESC, is_owner DESC, person_name
              ''', [lead_id])

          batch_out = {
              'campaign_id': 'lawyers-us',
              'selection_rule': out['selection_rule'],
              'generated_from_current_d1_queue': True,
              'leads': batch,
          }

          # New-production-only batch: these rows were created by the V2 ZIP builder,
          # where Crawl4AI runs immediately and homepage_link_evidence should already exist.
          new_where = ready_where + " AND cl.qualification_reason = 'working_set_ready_for_validation' "
          new_batch = query(base_select + new_where + ordering + ' LIMIT 10', ['lawyers-us'])
          enriched_new_batch = []
          for lead in new_batch:
              links = query('''
                  SELECT homepage, final_url, url, anchor_text, crawled_at
                  FROM homepage_link_evidence
                  WHERE campaign_id = ? AND lead_id = ?
                  ORDER BY url
              ''', ['lawyers-us', lead['id']])
              item = dict(lead)
              item['homepage_link_count'] = len(links)
              item['crawl_evidence_available'] = bool(links)
              item['homepage_links'] = links
              enriched_new_batch.append(item)

          new_ready_count = (query('''
              SELECT COUNT(*) AS count
              FROM campaign_leads
              WHERE campaign_id = ?
                AND status = 'Ready for Validation'
                AND qualified = 0
                AND qualification_reason = 'working_set_ready_for_validation'
          ''', ['lawyers-us']) or [{'count': 0}])[0]['count']

          new_out = {
              'campaign_id': 'lawyers-us',
              'selection_rule': "new production only: status='Ready for Validation' AND qualified=0 AND qualification_reason='working_set_ready_for_validation'",
              'new_ready_count': new_ready_count,
              'batch_size': len(enriched_new_batch),
              'leads': enriched_new_batch,
          }

          Path('agents/validation next lead.json').write_text(
              json.dumps(out, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          Path('agents/validation next batch.json').write_text(
              json.dumps(batch_out, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          Path('agents/validation next new batch.json').write_text(
              json.dumps(new_out, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps({'next': out.get('lead'), 'new_batch': new_out, 'counts': counts}, indent=2, ensure_ascii=False))
          PY

      - name: Commit snapshots when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "agents/validation next lead.json" "agents/validation next batch.json" "agents/validation next new batch.json"
          if git diff --cached --quiet; then
            echo "Snapshots unchanged."
            exit 0
          fi
          git commit -m "Refresh validation runner snapshots"
          git push
