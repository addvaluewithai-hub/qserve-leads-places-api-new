name: Test Google Places price filter

on:
  workflow_dispatch:
  push:
    paths:
      - "test_places_price.py"
      - ".github/workflows/test-places-price.yml"

jobs:
  test-places-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TEST_LAT: "29.9724785"
      TEST_LNG: "30.9576332"
      TEST_RADIUS_METERS: "3000"
      TEST_PRICE_LEVEL: "PRICE_LEVEL_VERY_EXPENSIVE"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret is not configured for this repository."
            exit 2
          fi

      - name: Test Places API (New) $$$$ cafes
        run: python3 test_places_price.py
