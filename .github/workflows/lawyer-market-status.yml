name: Lawyer market coverage status

on:
  workflow_dispatch:
    inputs:
      next_markets:
        description: "How many next markets to show"
        required: true
        default: "25"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      NEXT_MARKETS: ${{ inputs.next_markets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print coverage and next-market queue
        run: |
          python scripts/market_manager.py status \
            --campaign lawyers-us \
            --next "$NEXT_MARKETS"
